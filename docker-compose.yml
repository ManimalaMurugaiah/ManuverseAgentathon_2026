version: "3.9"
services:
  redis:
    image: redis:7-alpine
    container_name: manuverse-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: manuverse-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  redis_data:
  ollama_data:
